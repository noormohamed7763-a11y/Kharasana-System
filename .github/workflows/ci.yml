name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    # 20 دقيقة لا 15: تجهيز حاوية SQL Server وتطبيق الترحيلات لكل اختبار تكامل
    # يضيف زمنًا لم يكن في الحساب حين كانت الاختبارات InMemory وحدها.
    timeout-minutes: 20

    # ✅ SQL Server حقيقي لاختبارات التكامل (Kharasana.IntegrationTests):
    #    InMemory لا ينفّذ SQL Server فلا يُثبت الفهارس المُرَشَّحة
    #    (WHERE IsDeleted = 0) ولا FK Restrict ولا RowVersion ولا ترتيب الحروف.
    #
    #    وكلمة المرور أدناه ليست سرًّا يجب إخفاؤه: حاوية قصيرة العمر على شبكة
    #    معزولة داخل عامل CI، تُهدَم بانتهاء المهمة، ولا تصل إلى أي قاعدة بيانات
    #    حقيقية. ووجودها في الملف مقصود كي تعمل الاختبارات بلا إعداد أسرار.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "${{ secrets.MSSQL_SA_PASSWORD }}"
        ports:
          - 1433:1433
        # GitHub لا يبدأ الخطوات حتى تصير الحاوية «سليمة»، وهذا الفحص هو ما
        # يمنع فشل أول اختبار لأن SQL Server ما زال يستعد. والمساران معًا لأن
        # اسم مجلد أدوات sqlcmd اختلف بين إصدارات الصورة (tools18 / tools).
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${{ secrets.MSSQL_SA_PASSWORD }}\" -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"${{ secrets.MSSQL_SA_PASSWORD }}\" -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
          --health-start-period 20s

    env:
      # المشروع يبني من هذه السلسلة اسم قاعدة معزولة لكل اختبار (SqlServerTestDatabase).
      # Database=master هنا مجرد أساس يستبدله الباني.
      KHARASANA_TEST_SQLSERVER: "Server=localhost,1433;Database=master;User Id=sa;Password=${{ secrets.MSSQL_SA_PASSWORD }};TrustServerCertificate=True"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Kharasana.slnx

      - name: Build
        run: dotnet build Kharasana.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Kharasana.slnx --no-build --configuration Release --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore
